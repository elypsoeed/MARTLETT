repositoriesPath:
  post:
    tags:
      - Repositories
    operationId: createRepository
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/requests/CreateRepositoryRequest.yaml"
    responses:
      "201":
        description: Repository created
        content:
          application/json:
            schema:
              $ref: "../schemas/responses/RepositoryResponse.yaml"
      "401":
        description: Authentication required
      "409":
        description: Repository already exists

repositoryByNamePath:
  parameters:
    - name: repositoryName
      in: path
      required: true
      schema:
        type: string
  delete:
    tags:
      - Repositories
    operationId: deleteRepository
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Repository deleted
      "401":
        description: Authentication required
      "404":
        description: Repository not found
