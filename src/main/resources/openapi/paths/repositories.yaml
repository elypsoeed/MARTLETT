repositoriesPath:
  get:
    tags:
      - Repositories
    operationId: getCurrentUserRepositories
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Current user repositories
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/responses/RepositoryResponse.yaml"
      "401":
        $ref: "../openapi-config.yaml#/components/responses/AuthenticationRequired"
  post:
    tags:
      - Repositories
    operationId: createRepository
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/requests/CreateRepositoryRequest.yaml"
    responses:
      "201":
        description: Repository created
        content:
          application/json:
            schema:
              $ref: "../schemas/responses/RepositoryResponse.yaml"
      "401":
        $ref: "../openapi-config.yaml#/components/responses/AuthenticationRequired"
      "409":
        $ref: "../openapi-config.yaml#/components/responses/RepositoryAlreadyExists"
      "400":
        $ref: "../openapi-config.yaml#/components/responses/InvalidRequest"

repositoryByNamePath:
  parameters:
    - name: repositoryName
      in: path
      required: true
      schema:
        type: string
  delete:
    tags:
      - Repositories
    operationId: deleteRepository
    security:
      - bearerAuth: []
    responses:
      "204":
        description: Repository deleted
      "401":
        $ref: "../openapi-config.yaml#/components/responses/AuthenticationRequired"
      "404":
        $ref: "../openapi-config.yaml#/components/responses/RepositoryNotFound"

userRepositoryByNamePath:
  parameters:
    - name: username
      in: path
      required: true
      schema:
        type: string
    - name: repositoryName
      in: path
      required: true
      schema:
        type: string
  get:
    tags:
      - Repositories
    operationId: getRepository
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Repository details
        content:
          application/json:
            schema:
              $ref: "../schemas/responses/RepositoryResponse.yaml"
      "401":
        $ref: "../openapi-config.yaml#/components/responses/AuthenticationRequired"
      "403":
        $ref: "../openapi-config.yaml#/components/responses/AccessDenied"
      "404":
        $ref: "../openapi-config.yaml#/components/responses/RepositoryNotFound"

