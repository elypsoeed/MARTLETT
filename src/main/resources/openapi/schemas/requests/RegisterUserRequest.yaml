type: object
required:
  - firstName
  - lastName
  - username
  - password
properties:
  firstName:
    type: string
    nullable: false
  lastName:
    type: string
    nullable: false
  username:
    type: string
    nullable: false
  password:
    type: string
    nullable: false
  sex:
    type: string
    nullable: true
    enum:
      - MALE
      - FEMALE
      - OTHER
  age:
    type: integer
    format: int32
    nullable: true
  city:
    type: string
    nullable: true
  tgContact:
    type: string
    nullable: true
  emailContact:
    type: string
    nullable: true
  placeOfWork:
    type: string
    nullable: true
