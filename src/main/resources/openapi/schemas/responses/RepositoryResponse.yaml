    type: integer
    format: int64
    nullable: false
  name:
    type: string
    nullable: false
  ownerNickname:
    type: string
    nullable: false
  fullName:
    type: string
    nullable: false
  visibility:
    $ref: "../RepositoryVisibility.yaml"
  createdTimestamp:
    type: string
    format: date-time
    nullable: false
