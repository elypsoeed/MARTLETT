openapi: 3.0.3
info:
  title: Martlett API
  version: 0.0.1
  description: API contract used for OpenAPI code generation.

paths:
  /api/auth/register:
    $ref: "./paths/auth-register.yaml"
  /api/auth/token:
    $ref: "./paths/auth-token.yaml"
  /api/auth/refresh:
    $ref: "./paths/auth-refresh.yaml"
  /api/hi:
    $ref: "./paths/hi.yaml"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
