spring:
  application:
    name: martlett
  config:
    import: optional:vault:///secret/martlett
  datasource:
    url: jdbc:postgresql://localhost:5432/martlett
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  cloud:
    vault:
      enabled: true
      uri: http://127.0.0.1:8200
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      fail-fast: true

management:
  health:
    vault:
      enabled: true
