spring:
  application:
    name: martlett
  cloud:
    vault:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/martlett
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - http://localhost:3000

  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 1209600
    issuer: martlett

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
