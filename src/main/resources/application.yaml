spring:
  application:
    name: martlett
  config:
    import: vault:///secret/martlett/app
  datasource:
    url: jdbc:postgresql://localhost:5432/martlett
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration
  cloud:
    vault:
      enabled: true
      uri: http://127.0.0.1:8200
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_APPROLE_ROLE_ID}
        secret-id: ${VAULT_APPROLE_SECRET_ID}
      fail-fast: true

app:
  jwt:
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 1209600
    issuer: martlett
