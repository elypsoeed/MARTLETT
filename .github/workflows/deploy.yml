name: Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew bootJar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/elypsoeed/martlett:staging .
          docker push ghcr.io/elypsoeed/martlett:staging
  deploy:
    runs-on: [ self-hosted, staging, deploy ]
    needs: build-and-push
    env:
      COMPOSE_ARGS: >-
        --project-directory .
        --env-file /opt/martlett/.env
        -f docker-compose/docker-compose.yml
        -f docker-compose/docker-compose.staging.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull latest image
        run: docker compose $COMPOSE_ARGS pull app

      - name: Recreate containers
        run:  docker compose $COMPOSE_ARGS up -d --wait

      - name: Show status
        run: docker compose $COMPOSE_ARGS ps
