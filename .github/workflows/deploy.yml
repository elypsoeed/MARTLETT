name: Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build jar
        run: ./gradlew bootJar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/elypsoeed/martlett:staging .
          docker push ghcr.io/elypsoeed/martlett:staging
  deploy:
    runs-on: [ self-hosted, staging, deploy ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest image
        working-directory: /opt/martlett
        run: docker compose --env-file .env pull app

      - name: Recreate containers
        working-directory: /opt/martlett
        run: docker compose --env-file .env up -d

      - name: Show status
        working-directory: /opt/martlett
        run: docker compose --env-file .env ps
    needs: build-and-push